url: https://paulesantos.github.io/walkability/

home:
  title: walkability R package
  description: High-performance geospatial graph analysis for urban street networks, walkability, and active mobility. Powered by multi-threaded Rust kernels with exact partial-edge credits and publication-ready ggplot2 visualizations.

authors:
  Paul E. Santos Andrade:
    href: https://orcid.org/0000-0002-6635-0375

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    bg: "#F9F9F9"
    fg: "#001219"
    primary: "#005F73"
    secondary: "#0A9396"
    tertiary: "#94D2BD"
    info: "#E9D8A6"
    base_font: {google: "Nunito Sans"}
    heading_font: {google: "Nunito Sans"}
    code_font: {google: "Fira Code"}
    headings-font-weight: 500
    navbar-bg: "#DEF1EB"
    nav-link-color: "#005F73"
  theme: pygments

  opengraph:
    image:
      src: man/figures/cusco_reach.png
      alt: "10-minute reachable walkable network length map for Cusco"
    twitter:
      creator: "@paulefrens"
      card: summary_large_image

navbar:
  type: light
  bg: "#DEF1EB"
  structure:
    left: [home, intro, reference, articles, news]
    right: [search, github]
  components:
    home:
      icon: fa-home
      aria-label: "Home"
      href: index.html
    intro:
      text: "Get Started"
      href: articles/walkability-guide.html
    articles:
      text: Articles
      menu:
        - text: "Tutorials & Workflows"
        - text: "Guía de Inicio Rápido (Get Started)"
          href: articles/walkability-guide.html
        - text: "Análisis Avanzado: Ruteo, Isócronas y Accesibilidad"
          href: articles/analisis-avanzado.html
        - text: "Visualización Avanzada con ggplot2 y patchwork"
          href: articles/visualizacion-avanzada.html
        - text: "-------"
        - text: "Theory & Empirical Results"
        - text: "Metodología, Motor Rust y Supuestos"
          href: articles/metodologia-y-supuestos.html
        - text: "Resultados en Ciudades de Referencia"
          href: articles/ciudades-referencia.html

reference:
  - title: "Sample Street Networks"
    desc: "Real-world OpenStreetMap walkable networks for benchmark cities in Peru."
    contents:
      - streets_cusco
      - streets_lima
      - streets_arequipa

  - title: "Topological Diagnostics"
    desc: "Inspect user-supplied street networks for connectivity, dead ends, and undershoots without mutating geometries."
    contents:
      - walk_diagnose_network
      - print.walk_diagnosis
      - plot.walk_diagnosis

  - title: "Network Construction & Repair"
    desc: "Convert spatial vector data into pedestrian routing graphs with user-controlled snapping and planarization."
    contents:
      - walk_build_network
      - print.walk_network

  - title: "Walkability & Reach Metrics"
    desc: "Multi-threaded isochrone reachable length calculations and route directness evaluation."
    contents:
      - walk_compute_reach
      - print.walk_reach
      - plot.walk_reach
      - walk_compute_circuity

  - title: "Optimal Pedestrian Routing"
    desc: "Single-pair point-to-point shortest path routing across the street network using compiled Rust Dijkstra."
    contents:
      - walk_shortest_path
      - print.walk_path
      - plot.walk_path

  - title: "Isochrones & Reachable Envelopes"
    desc: "Multi-threshold concave hull polygons and corridor envelopes for walkable service areas."
    contents:
      - walk_isochrone
      - print.walk_isochrone
      - plot.walk_isochrone

  - title: "Network Morphology & Intersection Density"
    desc: "Node valence classification, cul-de-sacs, T-junctions, crossroads, and intersection density."
    contents:
      - walk_intersection_density
      - print.walk_morphology
      - plot.walk_morphology

  - title: "Facility & POI Accessibility"
    desc: "Multi-threaded cumulative accessibility to urban amenities (schools, health, transit) within walking time budgets."
    contents:
      - walk_compute_access
      - print.walk_access
      - plot.walk_access

  - title: "Intervention Scenarios & Street Closures"
    desc: "Simulate pedestrianization, street cuts, and compare before/after walkability metrics."
    contents:
      - walk_scenario_close
      - walk_compare_scenarios
      - print.walk_comparison
      - plot.walk_comparison

  - title: "Centrality & Network Betweenness"
    desc: "Calculate edge betweenness centrality, identify structural bottlenecks, and evaluate flow redistribution under street closures."
    contents:
      - walk_betweenness
      - print.walk_betweenness
      - plot.walk_betweenness
      - walk_scenario_betweenness
      - print.walk_scenario_betweenness

  - title: "Graph Interoperability"
    desc: "Seamless conversion to standard R spatial graph classes (sfnetworks, tidygraph)."
    contents:
      - as_sfnetwork
      - as_tidygraph

  - title: "Interactive Web Application (mapgl)"
    desc: "GPU-accelerated MapLibre GL interactive dashboard for real-time reach, isochrones, routing, and scenario analysis."
    contents:
      - walk_app

  - title: "Cartographic Visualizations"
    desc: "Publication-grade ggplot2 maps and minimalist cartographic themes."
    contents:
      - walk_plot_reach
      - walk_plot_diagnosis
      - theme_walkability

  - title: "Data Ingestion"
    desc: "Automated street network acquisition from OpenStreetMap."
    contents:
      - walk_download_osm

  - title: "Rust Acceleration Kernels"
    desc: "Low-level compiled Rust routines for CSR conversion and parallel Dijkstra search."
    contents:
      - rust_build_csr
      - rust_compute_reachable_length
      - rust_compute_circuity_sample
      - rust_shortest_path
      - rust_isochrone_subgraph
      - rust_compute_access_multi
